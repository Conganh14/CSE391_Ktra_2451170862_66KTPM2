<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List UI</title>
    <link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div
        class="card rounded-4 shadow-sm border-0 overflow-hidden mb-4 task-shell"
      >
        <div class="card-body p-4 p-md-5">
          <div
            class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3 mb-4"
          >
            <div>
              <h1 class="h2 mb-1">Task List</h1>
            </div>
            <button
              type="button"
              class="btn btn-primary btn-lg px-4"
              data-bs-toggle="modal"
              data-bs-target="#addTaskModal"
            >
              + Add Task
            </button>
          </div>

          <div id="taskList" class="list-group task-list">
            <div class="text-center text-secondary py-5">
              Đang tải danh sách công việc...
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="addTaskModal"
      tabindex="-1"
      aria-labelledby="addTaskModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content rounded-4 border-0 shadow-lg">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="addTaskModalLabel">Add Task</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body py-4">
            <form id="taskForm" novalidate>
              <div class="mb-4">
                <label for="taskName" class="form-label">Task</label>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="taskName"
                  placeholder="Type your task here..."
                  maxlength="100"
                />
                <div id="taskHelp" class="invalid-feedback"></div>
              </div>
              <div>
                <label class="form-label d-block mb-3">Priority</label>
                <div
                  class="btn-group"
                  role="group"
                  aria-label="Priority options"
                >
                  <input
                    type="radio"
                    class="btn-check"
                    name="priority"
                    id="priorityHigh"
                    autocomplete="off"
                    value="High"
                    checked
                  />
                  <label class="btn btn-outline-danger" for="priorityHigh"
                    >High</label
                  >
                  <input
                    type="radio"
                    class="btn-check"
                    name="priority"
                    id="priorityMedium"
                    autocomplete="off"
                    value="Medium"
                  />
                  <label class="btn btn-outline-warning" for="priorityMedium"
                    >Medium</label
                  >
                  <input
                    type="radio"
                    class="btn-check"
                    name="priority"
                    id="priorityLow"
                    autocomplete="off"
                    value="Low"
                  />
                  <label class="btn btn-outline-success" for="priorityLow"
                    >Low</label
                  >
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="submit" class="btn btn-primary" form="taskForm">
              Add
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
